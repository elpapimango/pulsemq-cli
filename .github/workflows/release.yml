name: Release binaries

# Builds cross-platform release binaries and attaches them to the GitHub
# Release for a `vX.Y.Z` tag. `workflow_dispatch` (with a `tag` input) lets an
# existing tag be (re)built without pushing a new one — e.g. to backfill
# binaries onto a release that was cut before this workflow existed.
#
# This repo has GitHub's "immutable releases" protection enabled: once a
# release is created, its assets are locked forever — there is no
# create-then-upload-later flow. So every binary is built first and handed
# to one final job that creates the release with all of them attached in a
# single call. A consequence of that same protection: re-running this
# workflow for a tag that already has a (now-immutable) release cannot add
# or replace anything on it — delete that release first if you need to redo
# it.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach binaries for (e.g. v0.9.2) — leave empty when re-running a tag-push-triggered run'
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # --all-features: a released binary should support every transport
      # (tls, websocket) out of the box — the non-default features exist to
      # keep the *default* `cargo build`/CI dependency tree lean, not to ship
      # a deliberately crippled release artifact.
      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          bin=target/$TARGET/release/wispmq-cli
          strip "$bin"
          asset="wispmq-cli-$TAG_NAME-$TARGET.tar.gz"
          tar -czf "$asset" -C "target/$TARGET/release" wispmq-cli -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          bin="target/$TARGET/release/wispmq-cli.exe"
          asset="wispmq-cli-$TAG_NAME-$TARGET.zip"
          7z a "$asset" "$bin" LICENSE-MIT LICENSE-APACHE
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release with every binary attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
