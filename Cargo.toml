[package]
name = "pulsemq-cli"
version = "0.9.0"
edition = "2021"
description = "pulsemq-cli — a command-line MQTT v5.0 / 3.1.1 / 3.1 client: publish, subscribe, request/response"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elpapimango/pulsemq-cli"
keywords = ["mqtt", "cli", "client", "iot", "pubsub"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "pulsemq-cli"
path = "src/main.rs"

[dependencies]
# The protocol layer is in-tree, under `src/mqtt` — this crate builds and ships
# on its own, with no broker checkout beside it.
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
clap = { version = "4.6.6", features = ["derive"] }
# --json report output.
serde_json = "1"
# TLS / mutual TLS, behind the `tls` feature (see [features] below) so the
# plain-TCP build's dependency tree is untouched by default.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }

[profile.release]
lto = true
codegen-units = 1

[features]
# Non-default: `cargo build`/`test`/`clippy` with no flags keep today's
# dependency tree exactly. CI runs the four gates again with
# `--all-features` so this code is actually compiled and tested (TODO.md
# item 9).
tls = [
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
]

[dev-dependencies]
rcgen = "0.13"
