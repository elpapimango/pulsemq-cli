[package]
name = "wispmq-cli"
version = "0.9.2"
edition = "2021"
description = "wispmq-cli — a command-line MQTT v5.0 / 3.1.1 / 3.1 client: publish, subscribe, request/response"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elpapimango/wispmq-cli"
keywords = ["mqtt", "cli", "client", "iot", "pubsub"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "wispmq-cli"
path = "src/main.rs"

[dependencies]
# The protocol layer is the `wispmq-protocol` crate, shared with the WispMQ
# broker — a normal versioned dependency, not a path/git one, so this crate
# still builds and ships with no broker checkout beside it.
wispmq-protocol = "0.1"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
clap = { version = "4.6.6", features = ["derive"] }
# --json report output.
serde_json = "1"
# TLS / mutual TLS, behind the `tls` feature (see [features] below) so the
# plain-TCP build's dependency tree is untouched by default.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }
# WebSocket transport, behind the `websocket` feature. No default features:
# no bundled TLS connector, because `wss://` hands tokio-tungstenite a
# stream this crate already TLS-wrapped itself (via the `tls` feature)
# rather than letting it dial and wrap a second time.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[profile.release]
lto = true
codegen-units = 1

[features]
# Non-default: `cargo build`/`test`/`clippy` with no flags keep today's
# dependency tree exactly. CI runs the four gates again with
# `--all-features` so this code is actually compiled and tested (TODO.md
# item 7).
tls = [
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
rcgen = "0.13"
