[package]
name = "pulsemq-cli"
version = "0.1.0"
edition = "2021"
description = "pulsemq-cli — a command-line MQTT v5.0 / 3.1.1 / 3.1 client: publish, subscribe, request/response"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elpapimango/pulsemq"
keywords = ["mqtt", "cli", "client", "iot", "pubsub"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "pulsemq-cli"
path = "src/main.rs"

[dependencies]
# The protocol layer is the broker's own codec, used as a library: `packet`
# encodes/decodes all 15 control packets for v5.0/3.1.1/3.1 and `framing` reads
# and writes whole frames over any AsyncRead/AsyncWrite. One codec, so client
# and broker cannot disagree about the wire.
pulsemq = { path = "../pulsemq", default-features = false }
tokio = { version = "1.53", features = ["rt", "macros", "net", "io-util", "time"] }
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
